[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs a running PostgreSQL (DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
