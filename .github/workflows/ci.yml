name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: license
          POSTGRES_PASSWORD: license
          POSTGRES_DB: license_portal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U license"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://license:license@localhost:5432/license_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest tests/unit -v
      - name: Migrations apply cleanly
        run: alembic upgrade head && alembic downgrade base
      - name: Integration tests
        run: pytest tests/integration -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/api/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down -v
