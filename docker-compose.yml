services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: license
      POSTGRES_PASSWORD: license
      POSTGRES_DB: license_portal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license -d license_portal"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://license:license@db:5432/license_portal
      LICENSE_SIGNING_SECRET: ${LICENSE_SIGNING_SECRET:-dev-only-change-me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
